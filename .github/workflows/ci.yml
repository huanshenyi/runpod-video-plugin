name: Local checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: plugins/production-board/app/package-lock.json
      - run: npm ci
        working-directory: plugins/production-board/app
      - run: npm test
        working-directory: plugins/production-board/app
      - run: npm run build
        working-directory: plugins/production-board/app
      - run: node plugins/production-board/scripts/check-package.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r plugins/production-board/scripts/media-check-requirements.txt
      - run: python -B -m unittest discover -s plugins/production-board/tests -v
